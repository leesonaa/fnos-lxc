name: Build fpk

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FNPACK_VERSION: "1.3.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile app/server/main.py app/server/lxcconf.py app/server/guestnet.py

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version=.*/version=${GITHUB_REF_NAME#v}/" manifest

      - name: Install fnpack
        run: |
          curl -fsSL -o fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Build fpk
        id: build
        env:
          FNOS_DEV_KEY: ${{ secrets.FNOS_DEV_KEY }}
          FNOS_DEV_CERT: ${{ secrets.FNOS_DEV_CERT }}
        run: |
          chmod +x cmd/* wizard/* 2>/dev/null || true
          VERSION=$(sed -n 's/^version=//p' manifest)
          if [ -n "$FNOS_DEV_KEY" ] && [ -n "$FNOS_DEV_CERT" ]; then
            umask 077
            printf '%s\n' "$FNOS_DEV_KEY" > "$RUNNER_TEMP/developer.key"
            printf '%s\n' "$FNOS_DEV_CERT" > "$RUNNER_TEMP/developer.crt"
            fnpack build --key "$RUNNER_TEMP/developer.key" --cert "$RUNNER_TEMP/developer.crt"
            OUT="fnos-lxc-${VERSION}.fpk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 FNOS_DEV_KEY / FNOS_DEV_CERT，生成的是未签名包（仅供调试，不会发布 Release）"
            fnpack build --nosign
            OUT="fnos-lxc-${VERSION}-unsigned.fpk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p dist
          mv ./*.fpk "dist/$OUT"
          ls -l dist
          echo "file=dist/$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: fnos-lxc-fpk
          path: dist/*.fpk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.file }}
          generate_release_notes: true
